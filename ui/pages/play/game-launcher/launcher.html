<section class="launcher">

    <div class="container">

        <div class="launcher-card">

            <div class="launcher-banner">

                <img
                    id="launcher-banner"
                    src=""
                    alt="Game Banner">

            </div>

            <div class="launcher-content">

                <span
                    id="launcher-badge"
                    class="game-badge">

                </span>

                <h1 id="launcher-title"></h1>

                <p id="launcher-description"></p>

                <div class="launcher-actions">

                    <button
                        id="start-game-btn"
                        class="btn btn-primary">

                        ▶ Start Game

                    </button>

                    <button
                        id="fullscreen-btn"
                        class="btn btn-secondary">

                        ⛶ Full Screen

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>
